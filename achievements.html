<h1 class="page-title">実績</h1><p class="lead">各コンテンツを一度でも開くとバッジが解除されます。全タイトルのコンプリートを目指そう。</p>

<div class="achv-summary"><div class="num" id="sum-count">0/6</div><div><div>コンプリート状況</div><div class="achv-bar"><i id="sum-fill"></i></div></div></div>

<footer class="footer">© 2026 kurekure.a1024. ALL Rights Reserved.</footer>
</div></main></div><script src="js/common.js"></script><script>
(function(){
  var data = krData();
  var grid = document.getElementById('achv-grid');
  var got = 0;
  KR_GAMES.forEach(function(g){
    var unlocked = !!data[g.id];
    if(unlocked) got++;
    var card = document.createElement('a');
    card.href = g.href;
    card.className = 'achv-card' + (unlocked ? ' unlocked' : '');
    var dateStr = unlocked ? new Date(data[g.id]).toLocaleDateString('ja-JP') + ' 解除' : '未プレイ';
    card.innerHTML = '<div class="badge-icon">' + g.icon + '</div><h4>' + g.name + '</h4><small>' + dateStr + '</small>';
    grid.appendChild(card);
  });
  document.getElementById('sum-count').textContent = got + '/' + KR_GAMES.length;
  document.getElementById('sum-fill').style.width = (got/KR_GAMES.length*100) + '%';
})();
</script></body></html>
