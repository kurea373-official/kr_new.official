<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>くれあ | ログイン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base:#fdf3ff;
    --bg-panel: rgba(255,255,255,0.72);
    --pop-1:#c9a8ff;   /* ラベンダー */
    --pop-2:#8ee6d0;   /* ミント */
    --pop-3:#ffe08a;   /* バター */
    --pop-4:#ffb3d1;   /* ピンク */
    --pop-5:#a6d4ff;   /* スカイ */
    --pop-1-strong:#9c6bff;
    --pop-4-strong:#ff6fa8;
    --pop-5-strong:#4fa8ff;
    --line: rgba(120, 80, 160, 0.14);
    --text-main:#3a2c50;
    --text-sub: rgba(58,44,80,0.56);
    --danger:#e8577a;
    --success-c:#28b892;
    --icon: rgba(58,44,80,0.34);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Noto Sans JP', sans-serif;
    background:var(--bg-base);
    color:var(--text-main);
    min-height:100vh;
    overflow:hidden;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ---- animated pastel background ---- */
  .aurora-bg{
    position:fixed; inset:0;
    z-index:0;
    overflow:hidden;
    background: linear-gradient(160deg, #fdf3ff 0%, #f5f2ff 45%, #eefaf6 100%);
  }
  .blob{
    position:absolute;
    border-radius:50%;
    filter:blur(70px);
    opacity:0.7;
    will-change: transform;
  }
  .blob.b1{
    width:44vw; height:44vw;
    background:radial-gradient(circle, var(--pop-1), transparent 70%);
    top:-12%; left:-10%;
    animation: drift1 24s ease-in-out infinite;
  }
  .blob.b2{
    width:36vw; height:36vw;
    background:radial-gradient(circle, var(--pop-2), transparent 70%);
    bottom:-14%; right:-8%;
    animation: drift2 28s ease-in-out infinite;
  }
  .blob.b3{
    width:26vw; height:26vw;
    background:radial-gradient(circle, var(--pop-3), transparent 70%);
    top:30%; right:14%;
    opacity:0.65;
    animation: drift3 20s ease-in-out infinite;
  }
  .blob.b4{
    width:26vw; height:26vw;
    background:radial-gradient(circle, var(--pop-4), transparent 70%);
    bottom:8%; left:10%;
    opacity:0.65;
    animation: drift4 26s ease-in-out infinite;
  }
  .blob.b5{
    width:20vw; height:20vw;
    background:radial-gradient(circle, var(--pop-5), transparent 70%);
    top:6%; right:32%;
    opacity:0.6;
    animation: drift5 22s ease-in-out infinite;
  }
  @keyframes drift1{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(7vw, 9vh) scale(1.1); }
  }
  @keyframes drift2{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-6vw, -7vh) scale(1.08); }
  }
  @keyframes drift3{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-9vw, 5vh) scale(0.92); }
  }
  @keyframes drift4{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(6vw, -7vh) scale(1.14); }
  }
  @keyframes drift5{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-5vw, 8vh) scale(0.9); }
  }

  /* ---- shell / brand ---- */
  .brand{
    position:fixed; top:34px; left:40px; z-index:3;
    display:flex; align-items:center; gap:10px;
    font-family:'Baloo 2', sans-serif;
    letter-spacing:0.01em;
  }
  .brand-mark{
    width:32px; height:32px; border-radius:11px;
    background:linear-gradient(135deg, var(--pop-4), var(--pop-1) 55%, var(--pop-5));
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 18px -6px rgba(156,107,255,0.45);
  }
  .brand-name{ font-size:17px; font-weight:700; color:var(--text-main); }

  /* ---- card ---- */
  .stage{
    position:relative; z-index:2;
    width:100%; max-width:392px;
    padding:0 20px;
  }
  .card{
    background:var(--bg-panel);
    border:1px solid rgba(255,255,255,0.6);
    border-radius:26px;
    padding:40px 34px 32px;
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    box-shadow: 0 30px 70px -24px rgba(156,107,255,0.35), 0 4px 18px -6px rgba(156,107,255,0.15);
  }
  .eyebrow{
    font-family:'Baloo 2', sans-serif;
    font-size:12px; letter-spacing:0.14em; font-weight:700;
    text-transform:uppercase;
    margin-bottom:12px;
    background: linear-gradient(90deg, var(--pop-4-strong), var(--pop-1-strong));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    display:inline-block;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-size:27px; font-weight:700;
    letter-spacing:-0.01em;
    margin-bottom:8px;
  }
  .sub{
    font-size:13px; color:var(--text-sub); line-height:1.6; margin-bottom:26px;
  }

  .field{ margin-bottom:16px; }
  .field label{
    display:block; font-size:12px; color:var(--text-sub);
    margin-bottom:7px; letter-spacing:0.02em; font-weight:500;
  }
  .input-wrap{ position:relative; }
  .input-wrap svg.field-icon{
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    color: var(--icon);
    pointer-events:none;
    transition: color .18s ease;
  }
  .field input{
    width:100%;
    padding:13px 14px 13px 40px;
    background: rgba(255,255,255,0.7);
    border:1.5px solid var(--line);
    border-radius:13px;
    color:var(--text-main);
    font-size:14px;
    font-family:'Noto Sans JP', sans-serif;
    outline:none;
    transition: border-color .18s ease, background .18s ease;
  }
  .field input::placeholder{ color:rgba(58,44,80,0.32); }
  .field input:focus{
    border-color: var(--pop-1-strong);
    background: rgba(255,255,255,0.95);
  }
  .field input:focus-visible{
    outline: 2px solid var(--pop-1-strong);
    outline-offset: 2px;
  }
  .input-wrap:focus-within svg.field-icon{
    color: var(--pop-1-strong);
  }
  #password{ padding-right:42px; }
  .toggle-pw{
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    background:none; border:none; cursor:pointer;
    color: var(--icon);
    display:flex; align-items:center; justify-content:center;
    padding:4px;
    transition: color .18s ease;
  }
  .toggle-pw:hover{ color: var(--text-main); }
  .toggle-pw:focus-visible{ outline: 2px solid var(--pop-1-strong); outline-offset:2px; border-radius:6px; }

  .row-between{
    display:flex; align-items:center; justify-content:space-between;
    margin: 4px 0 22px;
    font-size:12.5px;
  }
  .remember{ display:flex; align-items:center; gap:8px; color:var(--text-sub); }
  .remember input{ accent-color: var(--pop-4-strong); }
  .forgot{ color:var(--text-sub); text-decoration:none; border-bottom:1px solid transparent; }
  .forgot:hover{ color:var(--text-main); border-color: var(--text-sub); }

  .submit{
    width:100%;
    padding:13px 14px;
    border:none; border-radius:13px;
    background: linear-gradient(120deg, var(--pop-4-strong), var(--pop-1-strong) 55%, var(--pop-5-strong));
    color:#fff;
    font-family:'Baloo 2', sans-serif;
    font-size:15px; font-weight:700;
    letter-spacing:0.01em;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    box-shadow: 0 14px 26px -10px rgba(156,107,255,0.55);
  }
  .submit:hover{ filter:brightness(1.06); transform: translateY(-1px); }
  .submit:active{ transform: translateY(0); }
  .submit:focus-visible{ outline: 2px solid var(--pop-1-strong); outline-offset: 3px; }
  .submit[disabled]{ opacity:0.65; cursor:progress; filter:none; transform:none; }

  .banner{
    display:none;
    align-items:flex-start; gap:9px;
    font-size:12.5px;
    padding:10px 12px; border-radius:11px;
    margin-bottom:16px;
    line-height:1.5;
  }
  .banner.show{ display:flex; }
  .banner svg{ flex-shrink:0; margin-top:1px; }
  .banner.error{
    color:var(--danger);
    background: rgba(232,87,122,0.09);
    border:1px solid rgba(232,87,122,0.22);
  }
  .banner.ok{
    color:var(--success-c);
    background: rgba(40,184,146,0.10);
    border:1px solid rgba(40,184,146,0.24);
  }

  .demo-hint{
    margin-top:22px;
    padding:12px 14px;
    border-radius:13px;
    border:1.5px dashed rgba(255,111,168,0.4);
    background: rgba(255,179,209,0.12);
    font-size:12px;
    color:var(--text-sub);
    line-height:1.7;
  }
  .demo-hint b{ color:var(--pop-4-strong); font-weight:700; }

  .foot{
    margin-top:22px; text-align:center;
    font-size:12px; color:var(--text-sub);
  }

  /* success state */
  .success{
    display:none;
    text-align:center;
    padding:14px 0 4px;
  }
  .success.show{ display:block; }
  .success .ring{
    width:56px; height:56px; margin:0 auto 18px;
    border-radius:50%;
    background: linear-gradient(135deg, var(--pop-2), var(--pop-1-strong) 60%, var(--pop-4));
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 12px 26px -8px rgba(156,107,255,0.5);
    animation: pop-in .45s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop-in{
    0%{ transform:scale(0.4); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
  }
  .success h2{ font-family:'Baloo 2', sans-serif; font-size:20px; font-weight:700; margin-bottom:6px; }
  .success p{ font-size:13px; color:var(--text-sub); margin-bottom:20px; }

  .progress-track{
    width:100%; height:9px; border-radius:99px;
    background: rgba(58,44,80,0.09);
    overflow:hidden;
    margin-bottom:10px;
  }
  .progress-fill{
    height:100%; width:0%;
    border-radius:99px;
    background: linear-gradient(90deg, var(--pop-5-strong), var(--pop-1-strong), var(--pop-4-strong));
    background-size:200% 100%;
    transition: width .18s linear;
  }
  .progress-label{
    font-family:'Baloo 2', sans-serif;
    font-size:13px; font-weight:700;
    color: var(--pop-1-strong);
  }

  @media (prefers-reduced-motion: reduce){
    .blob{ animation: none !important; }
  }

  @media (max-width:480px){
    .brand{ top:20px; left:20px; }
    .card{ padding:32px 24px 26px; }
  }
</style>
</head>
<body>

  <div class="aurora-bg">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="blob b4"></div>
    <div class="blob b5"></div>
  </div>

  <div class="brand">
    <div class="brand-mark">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L14.2 9.2L21 12L14.2 14.8L12 22L9.8 14.8L3 12L9.8 9.2L12 2Z" fill="white"/>
      </svg>
    </div>
    <div class="brand-name">くれあ</div>
  </div>

  <div class="stage">
    <div class="card">

      <div id="loginView">
        <div class="eyebrow">Members Area</div>
        <h1>おかえりなさい</h1>
        <p class="sub">ログインID とパスワードを入力してください。</p>

        <div class="banner error" id="errorBox">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v5M12 16h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span id="errorText">ログインIDまたはパスワードが正しくありません。</span>
        </div>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="loginId">ログインID</label>
            <div class="input-wrap">
              <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Z" stroke="currentColor" stroke-width="1.8"/>
                <path d="M4 20.5c1.4-3.6 4.6-5.5 8-5.5s6.6 1.9 8 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
              <input type="text" id="loginId" name="loginId" placeholder="ログインIDを入力" autocomplete="username" required>
            </div>
          </div>
          <div class="field">
            <label for="password">パスワード</label>
            <div class="input-wrap">
              <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
                <rect x="5" y="11" width="14" height="9" rx="2.2" stroke="currentColor" stroke-width="1.8"/>
                <path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.8"/>
              </svg>
              <input type="password" id="password" name="password" placeholder="パスワードを入力" autocomplete="current-password" required>
              <button type="button" class="toggle-pw" id="togglePw" aria-label="パスワードを表示">
                <svg id="eyeIcon" width="17" height="17" viewBox="0 0 24 24" fill="none">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.8"/>
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="row-between">
            <label class="remember">
              <input type="checkbox" id="remember">
              ログイン状態を保持
            </label>
            <a href="#" class="forgot" id="forgotLink">パスワードをお忘れですか？</a>
          </div>

          <button type="submit" class="submit" id="submitBtn">
            <span id="submitLabel">ログイン</span>
            <svg id="submitIcon" width="15" height="15" viewBox="0 0 24 24" fill="none">
              <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>

        <div class="demo-hint">
          これはデモ用のログイン画面です。全ユーザー共通の認証情報でログインできます。<br>
          ID: <b>demo</b>　/　パスワード: <b>demo1234</b>
        </div>

        <div class="foot">アカウントをお持ちでない方は運営にお問い合わせください</div>
      </div>

      <div class="success" id="successView">
        <div class="ring">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
            <path d="M4 12.5L9.5 18L20 6.5" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2>ログインしました！</h2>
        <p id="successSub">まもなくページに移動します…</p>

        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-label"><span id="progressPct">0</span>% 読み込み中</div>
      </div>

    </div>
  </div>

<script>
  const DEMO_ID = "demo";
  const DEMO_PW = "demo1234";

  // ログイン成功後にジャンプさせたい自分のサイトのファイル名をここで指定
  const REDIRECT_URL = "dashboard.html";

  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('errorBox');
  const errorText = document.getElementById('errorText');
  const submitBtn = document.getElementById('submitBtn');
  const loginView = document.getElementById('loginView');
  const successView = document.getElementById('successView');
  const forgotLink = document.getElementById('forgotLink');
  const togglePw = document.getElementById('togglePw');
  const pwInput = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');
  const submitLabel = document.getElementById('submitLabel');
  const submitIcon = document.getElementById('submitIcon');
  const progressFill = document.getElementById('progressFill');
  const progressPct = document.getElementById('progressPct');

  togglePw.addEventListener('click', function(){
    const isText = pwInput.type === 'text';
    pwInput.type = isText ? 'password' : 'text';
    togglePw.setAttribute('aria-label', isText ? 'パスワードを表示' : 'パスワードを隠す');
    eyeIcon.innerHTML = isText
      ? '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>'
      : '<path d="M3 3l18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9.9 5.2A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.2 6.7C3.6 8.4 2 12 2 12s3.6 7 10 7c1.3 0 2.5-.2 3.6-.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9.9 14.1a3 3 0 0 0 4.2-4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>';
  });

  function showBanner(kind, message){
    errorBox.classList.remove('ok', 'error');
    errorBox.classList.add(kind, 'show');
    errorText.textContent = message;
  }
  function hideBanner(){
    errorBox.classList.remove('show');
  }

  function runProgressThenRedirect(){
    let pct = 0;
    const totalMs = 1400;
    const stepMs = 30;
    const steps = totalMs / stepMs;
    const inc = 100 / steps;

    const timer = setInterval(function(){
      pct = Math.min(100, pct + inc);
      const rounded = Math.round(pct);
      progressFill.style.width = rounded + '%';
      progressPct.textContent = rounded;

      if(pct >= 100){
        clearInterval(timer);
        document.getElementById('successSub').textContent = 'ページに移動します…';
        window.location.href = REDIRECT_URL;
      }
    }, stepMs);
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    hideBanner();

    const id = document.getElementById('loginId').value.trim();
    const pw = document.getElementById('password').value;

    if(!id || !pw){
      showBanner('error', 'ログインIDとパスワードの両方を入力してください。');
      return;
    }

    submitBtn.disabled = true;
    submitLabel.textContent = "確認中…";
    submitIcon.style.display = 'none';

    setTimeout(function(){
      if(id === DEMO_ID && pw === DEMO_PW){
        loginView.style.display = 'none';
        successView.classList.add('show');
        runProgressThenRedirect();
      } else {
        submitBtn.disabled = false;
        submitLabel.textContent = "ログイン";
        submitIcon.style.display = '';
        showBanner('error', 'ログインIDまたはパスワードが正しくありません。');
      }
    }, 550);
  });

  forgotLink.addEventListener('click', function(e){
    e.preventDefault();
    showBanner('error', 'デモ画面のため、パスワード再設定機能はありません。上記の共通IDでログインしてください。');
  });
</script>

</body>
</html>
